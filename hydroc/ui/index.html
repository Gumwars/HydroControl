<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HydroControl</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ── Tokens: Nocturne dark + Matugen accent (seed #8CBF73, OKLCH hue 141) ──
   From the GUI polish design. warn / danger / info are deliberately NOT
   derived from the accent: status colour must mean the same thing on every
   desktop. */
:root{
  --bg:oklch(0.148 0.008 141);          /* app frame */
  --surface:oklch(0.198 0.008 141);     /* cards, raised panels */
  --surface-2:oklch(0.225 0.008 141);   /* raised again: hover, wells, tracks */
  --surface-3:oklch(0.255 0.009 141);   /* active / selected fill */
  --fg:oklch(0.935 0.008 141);
  --muted:oklch(0.705 0.010 141);
  --faint:oklch(0.575 0.010 141);
  --border:oklch(0.305 0.009 141);
  --border-soft:oklch(0.255 0.008 141);
  --accent:#8CBF73;
  --accent-bright:oklch(0.82 0.115 140);
  --accent-soft:color-mix(in oklab,var(--accent) 16%,transparent);
  --accent-ring:color-mix(in oklab,var(--accent) 45%,transparent);
  --on-accent:oklch(0.22 0.02 141);
  --warn:oklch(0.78 0.13 78);
  --warn-soft:color-mix(in oklab,var(--warn) 15%,transparent);
  --danger:oklch(0.66 0.19 27);
  --danger-soft:color-mix(in oklab,var(--danger) 15%,transparent);
  --info:oklch(0.72 0.12 245);
  --info-soft:color-mix(in oklab,var(--info) 14%,transparent);
  --radius:10px;
  --shadow-card:0 0 0 1px rgba(0,0,0,.22),0 1px 0 rgba(255,255,255,.04) inset,0 14px 40px rgba(0,0,0,.4);
  --glow-accent:color-mix(in oklab,var(--accent) 7%,transparent);

  /* The names the rest of this file was written against, mapped onto the
     tokens above so every existing control takes the new palette without
     being rewritten. */
  --color-bg:var(--bg); --color-surface:var(--surface);
  --color-text:var(--fg); --color-accent:var(--accent);
  --color-accent-2:var(--accent-bright);
  --color-divider:var(--border);
  --color-neutral-300:oklch(0.846 0.010 141); --color-neutral-400:var(--muted);
  --color-neutral-500:var(--faint); --color-neutral-700:oklch(0.446 0.012 141);
  --color-neutral-800:var(--surface-3); --color-neutral-900:var(--surface-2);
  --color-accent-100:oklch(0.972 0.022 139); --color-accent-200:oklch(0.930 0.048 139);
  --color-accent-800:oklch(0.400 0.068 139);
  --color-warn:var(--warn); --color-danger:var(--danger); --color-info:var(--info);
  --color-warn-tint:var(--warn-soft); --color-danger-tint:var(--danger-soft);
  --font-body:"Inter",-apple-system,"Segoe UI",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --space-2:5.6px; --space-3:8.4px; --space-4:11.2px; --space-6:16.8px; --space-8:22.4px;
  --radius-sm:7px; --radius-md:var(--radius); --radius-lg:14px;
  /* One selection language for the whole app. Selected controls were drawn
     three different ways: seg used an inset 1px ring, swatch a detached 2px
     outline, and .btn nothing at all. */
  --sel-tint:color-mix(in oklab,var(--color-accent) 14%,transparent);
  --sel-ring:0 0 0 2px var(--color-bg),0 0 0 3.5px var(--color-accent);
  --shadow-sm:0 0 0 1px var(--border-soft);
  --shadow-md:0 0 0 1px var(--border),0 6px 18px rgba(0,0,0,.55);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--fg);overflow:hidden;
  background:
    radial-gradient(1200px 720px at 78% -12%,var(--glow-accent),transparent 62%),
    radial-gradient(900px 600px at -8% 108%,color-mix(in oklab,var(--info) 4%,transparent),transparent 60%),
    var(--bg);
  font:400 13px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.kv{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-weight:500;line-height:1.12;letter-spacing:-.015em;margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent-soft)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ── shell: title bar over sidebar + content ── */
.app{display:flex;flex-direction:column;height:100vh}
.titlebar{flex:none;display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;
  background:color-mix(in oklab,var(--surface) 82%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft)}
.tb-brand{display:flex;align-items:center;gap:9px;min-width:0}
.tb-logo{width:18px;height:18px;border-radius:5px;flex:none;
  background:linear-gradient(140deg,var(--accent-bright),var(--accent));
  box-shadow:0 0 0 1px color-mix(in oklab,var(--accent) 40%,transparent),
             0 0 12px color-mix(in oklab,var(--accent) 35%,transparent)}
.tb-name{font-weight:600;font-size:12.5px;letter-spacing:-.01em;white-space:nowrap}
.tb-device{font-family:var(--font-mono);font-size:10.5px;color:var(--faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-status{display:flex;align-items:center;gap:8px;flex:none}
#vizSwitch{margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.02em;white-space:nowrap;
  border:1px solid var(--border);color:var(--muted)}
.chip .dot{width:6px;height:6px;margin:0;border-radius:50%;flex:none}
.chip.live{color:var(--fg)}
.chip.live .dot{background:var(--accent);animation:pulse 2.2s ease-in-out infinite}
.chip.warn{color:var(--warn);border-color:color-mix(in oklab,var(--warn) 40%,transparent)}
.chip.warn .dot{background:var(--warn)}
.chip.bad{color:var(--danger);border-color:color-mix(in oklab,var(--danger) 40%,transparent)}
.chip.bad .dot{background:var(--danger)}
.layout{flex:1;display:flex;min-height:0}

.side{flex:none;width:216px;display:flex;flex-direction:column;gap:2px;padding:14px 10px;
  background:color-mix(in oklab,var(--surface) 40%,transparent);
  border-right:1px solid var(--border-soft)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{position:relative;display:flex;align-items:center;gap:10px;height:38px;padding:0 11px;
  border:0;border-radius:var(--radius-sm);background:none;cursor:pointer;text-align:left;
  color:var(--muted);font:500 13px var(--font-body);transition:background .13s,color .13s}
.nav-item svg{width:16px;height:16px;flex:none}
.nav-item:hover{background:var(--surface-2);color:var(--fg)}
.nav-item[aria-current]{background:color-mix(in oklab,var(--accent) 12%,var(--surface-3));color:var(--fg)}
.nav-item[aria-current]::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:2px;
  border-radius:1px;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.nav-item[aria-current] svg{color:var(--accent-bright)}

.health{margin-top:auto;padding:10px 11px;border-radius:var(--radius-sm);
  background:var(--surface);box-shadow:0 0 0 1px var(--border-soft);font-size:11px}
.health .hrow{display:flex;align-items:center;gap:7px}
.health .led{width:6px;height:6px;border-radius:50%;flex:none;background:var(--accent);
  animation:pulse 2.2s infinite}
.health .led.bad{background:var(--danger);animation:none}
.health .name{font-family:var(--font-mono);font-size:11px}
.health .st{margin-left:auto;font-size:10px;color:var(--accent)}
.health .st.bad{color:var(--danger)}
.health .hl{margin-top:6px;font-family:var(--font-mono);font-size:9.5px;line-height:1.6;color:var(--faint)}
.health .hl .bad{color:var(--danger)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px}

main{flex:1;min-width:0;display:flex;flex-direction:column}
.hd{flex:none;display:flex;align-items:center;gap:12px;padding:15px 24px 12px}
.hd h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
.hd .sub{font-size:11.5px;color:var(--faint);align-self:flex-end;padding-bottom:1px}
.content{flex:1;overflow:auto;padding:0 24px 28px;
  scrollbar-width:thin;scrollbar-color:var(--surface-3) transparent}
.content::-webkit-scrollbar{width:8px}
.content::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:4px}
.content>*{max-width:1120px}

/* ── cards ── */
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
.card{background:linear-gradient(180deg,color-mix(in oklab,var(--fg) 2.5%,var(--surface)),var(--surface) 34%);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:16px;
  display:flex;flex-direction:column;gap:10px;min-width:0}
.kick{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lbl{font-size:12px;color:var(--color-neutral-400)}
.big{font:500 30px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.unit{font-size:13px;color:var(--color-neutral-500);font-weight:400}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* ── controls (GUI polish design) ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;
  height:30px;padding:0 13px;font:500 12px/1 var(--font-body);color:var(--fg);background:transparent;
  border:1px solid transparent;border-radius:var(--radius-sm);
  transition:background .14s,border-color .14s,color .14s,transform .04s}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover:not(:disabled){background:var(--accent-bright)}
.btn-secondary{background:var(--surface-2);border-color:var(--border)}
.btn-secondary:hover:not(:disabled){background:var(--surface-3)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Segmented: a recessed well, the chosen segment raised out of it. */
.seg{display:inline-flex;align-self:flex-start;padding:2px;gap:2px;border-radius:var(--radius-sm);
  background:var(--surface-2)}
.seg button{height:26px;padding:0 12px;border:0;border-radius:6px;background:none;cursor:pointer;
  font:400 11.5px var(--font-body);color:var(--muted);transition:background .13s,color .13s}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--fg);box-shadow:0 0 0 1px var(--border)}

/* A joined segmented control cannot wrap: its well would break across rows.
   Groups that wrap are standalone pills instead -- the design's .pick, which
   is a different element here (the RGB picker), so the style lives on these. */
.seg.wrap{background:none;padding:0;gap:6px;flex-wrap:wrap}
.seg.wrap button{height:28px;padding:0 11px;border:1px solid transparent;border-radius:var(--radius-sm);
  background:var(--surface-2);font-size:12px;transition:background .13s,color .13s,border-color .13s}
.seg.wrap button:hover{background:var(--surface-3);color:var(--fg)}

/* Selected state, applied last so it beats the :hover rules above at equal
   specificity: pills and pressable buttons share it. */
.seg.wrap button[aria-pressed="true"],
.btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-bright);
  border-color:var(--accent-ring);box-shadow:none}
.sw{flex:none;width:38px;height:21px;border-radius:11px;padding:2px;cursor:pointer;
  background:var(--surface-3);transition:background .16s;border:0}
.sw[aria-pressed="true"]{background:var(--accent)}
.sw i{display:block;width:17px;height:17px;border-radius:50%;background:var(--fg);
  transition:transform .16s,background .16s}
.sw[aria-pressed="true"] i{transform:translateX(17px);background:var(--on-accent)}
.sw:disabled{opacity:.45;cursor:not-allowed}

/* Sliders: the design's filled track. --fill is kept in step with the value
   by syncRanges() -- a native range input cannot colour its own left side. */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;
  margin:10px 0;outline:none;cursor:pointer;
  background:linear-gradient(90deg,var(--accent) 0 var(--fill,0%),var(--surface-2) 0)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
  border-radius:50%;background:var(--accent-bright);box-shadow:0 0 0 2px var(--bg);cursor:pointer;
  transition:box-shadow .12s}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;
  background:var(--accent-bright);box-shadow:0 0 0 2px var(--bg);cursor:pointer}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{
  box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent-ring)}
input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
input[type=range]:disabled{opacity:.4;cursor:not-allowed}
.tag{display:inline-flex;align-items:center;font:400 10.5px var(--font-mono);
  padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.tag-warn{background:var(--warn-soft);color:var(--warn)}
.tag-accent{background:var(--accent-soft);color:var(--accent-bright)}

/* ── banners: the design's notes. They carry warnings, so they keep a faint
   outline the design's inline notes do not need. ── */
.banner{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;
  border-radius:var(--radius);margin-bottom:14px;font-size:12px;line-height:1.5}
.banner.warn{background:var(--warn-soft);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--warn) 35%,transparent)}
.banner.warn b{color:var(--warn)}
.banner.bad{background:var(--danger-soft);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--danger) 40%,transparent)}
.banner.bad b{color:var(--danger)}
.banner b{font-weight:600}
.drift{font:400 11px var(--font-mono);color:var(--color-neutral-300);margin-top:5px}
.drift s{color:var(--color-neutral-500);text-decoration:none;opacity:.7}

/* ── keyboard: quarter-unit grid, 76 cols x 10 half-rows ── */
.kbwrap{width:664px;padding:9px;border-radius:var(--radius-md);background:var(--color-bg);
  box-shadow:var(--shadow-sm)}
.krow1{display:grid;grid-template-columns:repeat(20,1fr);height:30px;margin-bottom:1px}
.kmain{display:grid;grid-template-columns:repeat(76,1fr);grid-template-rows:repeat(10,17px)}
.kcell{padding:1.5px;cursor:pointer}
.kcap{height:100%;display:grid;place-items:center;border-radius:4px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);outline:0 solid transparent;outline-offset:1px}
.kcell[data-sel="1"] .kcap{outline:2px solid var(--color-accent-200)}
.kcap span{font-weight:500;line-height:1;letter-spacing:.01em}
.hint{display:flex;gap:14px;font-size:10.5px;color:var(--color-neutral-500);margin-top:8px}
.sws{display:flex;flex-wrap:wrap;gap:6px}
.swatch{width:28px;height:28px;border-radius:6px;cursor:pointer;border:0;flex:none;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);outline:0 solid transparent;outline-offset:2px;
  transition:transform .1s}
.swatch:hover{transform:scale(1.08)}
.swatch[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none}
.pick{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.pick .ch{flex:1}
.pickrow{display:flex;align-items:center;gap:9px}
.pickrow .lbl{width:12px;flex:none}
.pickrow .val{font-family:var(--font-mono);font-size:11px;width:30px;text-align:right;
  color:var(--color-neutral-300);flex:none}
.pv{display:inline-block;width:34px;height:18px;border-radius:5px;vertical-align:-4px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.4);margin-right:7px}
.hexin{width:88px;background:var(--surface-2);
  color:inherit;border:1px solid var(--border);border-radius:6px;
  padding:3px 7px;font:400 12px var(--font-mono);text-transform:uppercase}
.hexin:focus{outline:1px solid var(--accent-ring);background:var(--surface-3)}
/* R/G/B slider tracks tinted so the axis being dragged is obvious */
.ch[data-ch=r]{background:linear-gradient(90deg,#000,#FF3B30)}
.ch[data-ch=g]{background:linear-gradient(90deg,#000,#3BFF6B)}
.ch[data-ch=b]{background:linear-gradient(90deg,#000,#3E7BFA)}

/* ── readings: four styles, picked in the title bar (GUI polish design) ── */
.viz-switch{display:flex;align-items:center;gap:2px;padding:2px;border-radius:var(--radius-sm);
  background:var(--surface-2);border:1px solid var(--border-soft);flex:none}
.viz-btn{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border:0;
  border-radius:6px;background:none;cursor:pointer;font:400 11.5px var(--font-body);color:var(--muted);
  transition:background .13s,color .13s}
.viz-btn svg{width:13px;height:13px;flex:none}
.viz-btn:hover{color:var(--fg)}
.viz-btn[aria-pressed="true"]{background:var(--surface-3);color:var(--fg);box-shadow:0 0 0 1px var(--border)}
.viz-btn[aria-pressed="true"] svg{color:var(--accent-bright)}
@media (max-width:1260px){.viz-label{display:none}.viz-btn{padding:0 8px}}
.rd-card{align-items:center;justify-content:center}
.g-label{font-size:12.5px;font-weight:500;letter-spacing:.01em}
.gauge{display:flex;flex-direction:column;align-items:center;gap:5px}
.gauge svg{display:block}
.gauge path,.gauge circle,.gauge text{transition:stroke-dasharray .6s,stroke .3s,fill .3s}
.tbar{width:100%;display:flex;flex-direction:column;gap:7px}
.tbar-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tbar-num{font:600 26px/1 var(--font-mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums;transition:color .3s}
.tbar-unit{font-size:12px;color:var(--faint);margin-left:2px;font-weight:400}
.tbar-track{position:relative;height:14px;border-radius:7px;background:var(--surface-2);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.tbar-fill{position:relative;height:100%;border-radius:7px;min-width:11px;
  transition:width .6s cubic-bezier(.2,.75,.2,1),background .3s;box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.tbar-tip{position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:11px;height:11px;
  border-radius:50%;box-shadow:0 0 0 2px var(--bg),0 0 9px currentColor;transition:background .3s,color .3s}
.tbar-tick{position:absolute;top:0;bottom:0;width:1px;background:rgba(0,0,0,.34)}
.tbar-scale{display:flex;justify-content:space-between;font:400 8.5px var(--font-mono);color:var(--faint)}
.tramp{display:flex;flex-direction:column;align-items:center;gap:8px}
.tramp-num{font:600 30px/1 var(--font-mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums;transition:color .3s}
.tramp-unit{font-size:12px;color:var(--faint);margin-left:2px;font-weight:400}
.tramp-row{display:flex;align-items:stretch;gap:7px}
.tramp-scale{display:flex;flex-direction:column;justify-content:space-between;text-align:right;
  font:400 8.5px var(--font-mono);color:var(--faint);padding:1px 0}
.tramp-col{display:flex;flex-direction:column;gap:2px}
.tramp-seg{width:44px;height:7px;border-radius:2px;background:var(--surface-2);
  box-shadow:inset 0 1px 1px rgba(0,0,0,.25);transition:background .3s,box-shadow .3s}
@keyframes vizPop{from{opacity:0;transform:scale(.94) translateY(4px)}to{opacity:1;transform:none}}
.viz-pop{animation:vizPop .34s cubic-bezier(.2,.8,.2,1)}
.spark-pulse{animation:pulse 2.2s ease-in-out infinite}
.chart{width:100%;height:120px;display:block;overflow:visible}
.curvechart{width:100%;aspect-ratio:520/210;height:auto;display:block;
  overflow:visible;touch-action:none}
.curvechart .cpt{fill:var(--color-accent);cursor:ns-resize}
.curvechart .cpt:hover{r:7}
.chart .fill{fill:color-mix(in oklab,var(--color-accent) 18%,transparent)}
.chart .line{fill:none;stroke:var(--color-accent);stroke-width:1.6;
  stroke-linejoin:round;stroke-linecap:round}
.chart .limit{stroke:var(--color-warn);stroke-width:1;stroke-dasharray:3 3;opacity:.85}
.chart .limit2{stroke:var(--color-info);stroke-width:1;stroke-dasharray:2 4;opacity:.55}
.chart .grid{stroke:var(--color-divider);stroke-width:1}
.chart .end{fill:var(--color-accent-200)}
.chartlbl{font:400 9.5px var(--font-mono);fill:var(--color-neutral-500)}
.bar{height:6px;border-radius:3px;background:var(--color-neutral-900);overflow:hidden}
/* Volts per cell. Taller than .bar and not clipped, because the point
   is the markers sitting ON the track -- the gap between the ceiling
   and the rating is the protection, and it has to be visible. */
.vbar{position:relative;height:14px;border-radius:7px;
  background:var(--color-neutral-900);margin:var(--space-2) 0 var(--space-3)}
.vbar i{display:block;height:100%;border-radius:7px;background:var(--color-accent);
  transition:width .4s ease}
.vbar u{position:absolute;top:-3px;bottom:-3px;width:2px;text-decoration:none;
  background:var(--color-text);opacity:.55}
.vbar u.rating{background:var(--color-danger);opacity:.75}
.vscale{display:flex;justify-content:space-between;font-size:10px;
  color:var(--color-neutral-400)}
.bar i{display:block;height:100%;background:var(--color-accent);border-radius:3px;
  transition:width .45s cubic-bezier(.4,0,.2,1)}

/* ── narrow windows: the sidebar becomes an icon rail ── */
/* The design collapses every grid to one column here. At the app window's
   usual ~800 px that stacked the Overview's cards past the fold, so three
   columns go to two first and only reach one below 720 px. */
@media (max-width:940px){
  .g3{grid-template-columns:repeat(2,1fr)}
  .side{width:64px;padding:14px 8px}
  .nav-item{justify-content:center;padding:0}
  .nav-item .nl,.health .name,.health .hl,.health .st{display:none}
  .health{display:flex;justify-content:center;padding:10px 0}
}
@media (max-width:720px){
  .g3,.g2{grid-template-columns:1fr}
  .tb-device{display:none}
  .hd,.content{padding-left:16px;padding-right:16px}
}
</style>
</head>
<body>
<div class="app">
  <header class="titlebar">
    <div class="tb-brand"><span class="tb-logo" aria-hidden="true"></span>
      <span class="tb-name">HydroControl</span><span class="tb-device" id="tbDevice"></span></div>
    <div class="viz-switch" id="vizSwitch" role="group" aria-label="Reading style"></div>
    <div class="tb-status" id="tbStatus"></div>
  </header>
  <div class="layout">
    <aside class="side">
      <nav class="nav" id="nav" aria-label="Sections"></nav>
      <div class="health" id="health"></div>
    </aside>
    <main>
      <div class="hd"><h2 id="secName">Overview</h2><span class="sub" id="secSub"></span></div>
      <div class="content"><div id="banners"></div><div id="view"></div></div>
    </main>
  </div>
</div>
<script>
const NAV=[
 {id:'overview',name:'Overview',sub:'live telemetry · 1 Hz'},
 {id:'perf',name:'Performance',sub:'EC power limits · volatile'},
 {id:'batt',name:'Battery',sub:'charging policy · health'},
 {id:'fans',name:'Fans',sub:'curve control · verified'},
 {id:'light',name:'Lighting',sub:'keyboard · chin bar'},
 {id:'lpp',name:'Cooling dock',sub:'LPP · Bluetooth LE',optional:true},
 {id:'sys',name:'System',sub:'platform toggles'}];

// Nav icons: the GUI polish design's set, plus Fans (its unused i-fan symbol)
// and the cooling dock, which the design does not cover, drawn to match.
const svgI=(body,extra='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"${extra}>${body}</svg>`;
const NAV_ICON={
 overview:svgI('<path d="M4.5 18a7.5 7.5 0 1 1 15 0"/><path d="M12 15.5 14.8 10"/><circle cx="12" cy="15.5" r="1.4"/>'),
 perf:svgI('<path d="M13 2 4.5 13.5H11L10.5 22 19 10.5h-6.5L13 2z"/>'),
 batt:svgI('<rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 10.5v3"/><path d="M12.5 8.5 9.5 12.5h2.3l-1.1 3"/>'),
 fans:svgI('<path d="M3 8h9a3 3 0 1 0-3-3M3 12h13a3 3 0 1 1-3 3M3 16h7a3 3 0 1 1-3 3"/>'),
 light:svgI('<path d="M9.5 18h5"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.3c.6.5 1 1.3 1 2.2h6c0-.9.4-1.7 1-2.2A6 6 0 0 0 12 3z"/>'),
 lpp:svgI('<path d="M5 13h14l-1.5 4h-11z"/><path d="M6 13V6.5A1.5 1.5 0 0 1 7.5 5h9A1.5 1.5 0 0 1 18 6.5V13"/><path d="M9 20.5c1-.7 2-.7 3 0s2 .7 3 0"/>'),
 sys:svgI('<path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="1.6" fill="var(--bg)"/><circle cx="15" cy="12" r="1.6" fill="var(--bg)"/><circle cx="7" cy="17" r="1.6" fill="var(--bg)"/>')};

const PUMP={low:'Low',medium:'Medium',high:'High',max:'Max'};

const CHARGE=[
 {id:'stationary',name:'Stationary',token:'charge_types = Trickle',desc:'Mostly plugged in at a desk.'},
 {id:'balanced',name:'Balanced',token:'charge_types = Long_Life',desc:'Mixed use — desk and away.'},
 {id:'long_haul',name:'Long Haul',token:'charge_types = Standard',desc:'Maximise runtime away from power.'}];

const CHIN=[{id:'static',name:'Static'},{id:'breathing',name:'Breathing'},{id:'off',name:'Off'},
 {id:'wave',name:'Wave',nocol:true},{id:'clash',name:'Clash'},{id:'catchup',name:'Catchup',nocol:true}];

const EFFECTS=['breathing','wave','random','rainbow','ripple','marquee','raindrop','aurora','fireworks'];
// Firmware effect-colour slots, index-for-index as ite8291r3-ctl defines them
// (`colors` in ite8291r3.py, identical in 0.3 and 0.4). The UI used to draw a
// house palette over these indices, so slot 0 showed white but means "none",
// 5 showed cyan but is blue, 6 showed blue but is teal, and "random" was
// missing entirely — picking a colour genuinely gave you a different one.
// Only the NAMES are authoritative here; the hex is our swatch approximation.
const FW_COLORS=[['none','#2A2A2E'],['red','#FF3B30'],['orange','#FF9500'],
 ['yellow','#FFE000'],['green','#4CD964'],['blue','#3E7BFA'],['teal','#37D6D6'],
 ['purple','#9C6BFF'],['random','linear-gradient(135deg,#FF3B30,#FFE000,#4CD964,#37D6D6,#9C6BFF)']];

const TOGGLES=[
 {id:'fn_lock',name:'Fn lock',path:'INOU0000:00/fn_lock'},
 {id:'super_key_enable',name:'Super key enabled',path:'INOU0000:00/super_key_enable'},
 {id:'touchpad_toggle_enable',name:'Touchpad toggle hotkey',path:'INOU0000:00/touchpad_toggle_enable'}];

const POWERMODES=[
 {id:'none',name:'Neither',desc:'Both attributes cleared.'},
 {id:'ac',name:'AC auto-boot',desc:'Powers on when AC is connected — ac_auto_boot = 1.'},
 {id:'usb',name:'USB powershare',desc:'USB stays powered while off or hibernating — usb_powershare_high = 1.'}];

// ── keyboard geometry: widths in QUARTER units. Main block cols 1-60, numpad 61-76.
// 10 half-height rows so ↑/↓ stack and Num+/NumEnter span two rows.
const ROW1=['Esc','F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12','ScrnCap','PrtSc','Del','Home','PgUp','PgDn','End'];
const ROWS=[
 {r:1,main:[['`',4],['1',4],['2',4],['3',4],['4',4],['5',4],['6',4],['7',4],['8',4],['9',4],['0',4],['-',4],['=',4],['Bksp',8]],
      pad:[['NumLk',4],['/',4],['*',4],['−',4]]},
 {r:3,main:[['Tab',6],['Q',4],['W',4],['E',4],['R',4],['T',4],['Y',4],['U',4],['I',4],['O',4],['P',4],['[',4],[']',4],['\\',6]],
      pad:[['7',4],['8',4],['9',4],['+',4,{rs:4}]]},
 {r:5,main:[['Caps',7],['A',4],['S',4],['D',4],['F',4],['G',4],['H',4],['J',4],['K',4],['L',4],[';',4],["'",4],['Enter',9]],
      pad:[['4',4],['5',4],['6',4]]},
 {r:7,main:[['Shift',9],['Z',4],['X',4],['C',4],['V',4],['B',4],['N',4],['M',4],[',',4],['.',4],['/',4],['Shift',11]],
      pad:[['1',4],['2',4],['3',4],['↵',4,{rs:4}]]},
 {r:9,main:[['Ctrl',5],['Fn',4],['Super',4],['Alt',5],['',22],['Alt',4],['Ctrl',4],
            ['←',4],['↑',4,{rs:1}],['↓',4,{rs:1,half:true}],['→',4]],
      pad:[['0',8],['.',4]]}];

function regionOf(l,ri){
  if(['W','A','S','D'].includes(l)&&(ri===1||ri===2))return 'wasd';
  if(['←','↑','↓','→'].includes(l))return 'arrows';
  if(['Ctrl','Fn','Super','Alt','Shift','Caps','Tab'].includes(l))return 'mods';
  return 'main';
}
function buildKeys(){
  const out=[];
  ROW1.forEach((l,i)=>out.push({id:'f'+i,label:l,region:'frow'}));
  ROWS.forEach((row,ri)=>{
    let c=1;
    row.main.forEach((k,i)=>{
      const rs=k[2]&&k[2].rs?k[2].rs:2;
      const start=k[2]&&k[2].half?row.r+1:row.r;
      const col=k[2]&&k[2].half?c-k[1]:c;
      out.push({id:'m'+ri+'_'+i,label:k[0],gc:col+' / span '+k[1],gr:start+' / span '+rs,row:ri,region:regionOf(k[0],ri)});
      if(!(k[2]&&k[2].half))c+=k[1];
    });
    let p=61;
    row.pad.forEach((k,i)=>{
      const rs=k[2]&&k[2].rs?k[2].rs:2;
      out.push({id:'p'+ri+'_'+i,label:k[0],gc:p+' / span '+k[1],gr:row.r+' / span '+rs,row:ri,region:'numpad'});
      p+=k[1];
    });
  });
  return out;
}
const KEYS=buildKeys();
function lum(hex){const n=parseInt(hex.slice(1),16);
  return (0.2126*(n>>16)+0.7152*((n>>8)&255)+0.0722*(n&255))/255;}

// ── app state ──
const S={section:'overview',status:{},state:{},profile:{},drift:{},tel:{},
  kbColors:{},sel:[],cur:'#37D6D6',kbBri:34,kbSave:true,kbCorrect:true,kbTab:'effect',applyResult:null,hist:{pkg:[],cpu:[],gpu:[]},eff:'rainbow',effColor:4,
  chin:{mode:'static',color:'#8CBF73',bri:100,speed:5},lpp:{running:false},lppFan:null,
  effParams:{},kbSpeed:5,presets:[],activePreset:null,button:{},health:null,repair:null,native:[],nativeActive:null,buttonCycle:'native'};
KEYS.forEach(k=>S.kbColors[k.id]=k.region==='wasd'?'#FFE000':'#8CBF73');

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=(v,d='—')=>v===null||v===undefined?d:v;

// LEDs are additive emitters: the hardware takes an RGB triple and nothing else.
// (CMYK is a subtractive model for ink on paper — there is no K channel to send
// and no white substrate to subtract from, so it would only be a lossy detour
// back to these same three bytes.)
const hex2rgb=h=>{h=String(h).replace('#','');
  return [parseInt(h.slice(0,2),16)||0,parseInt(h.slice(2,4),16)||0,parseInt(h.slice(4,6),16)||0];};
const rgb2hex=(r,g,b)=>'#'+[r,g,b].map(v=>
  Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('').toUpperCase();
const CHAN=[['r','R'],['g','G'],['b','B']];

// Speed on the wire runs BACKWARDS: 1 is fastest, 10 is slowest. tuxedo-drivers
// documents this for the chin bar ("Range slowest 0x0a to fastest 0x01"). The
// keyboard library only says 0-10 and never states a direction, so KB_SPEED_
// INVERTED is an assumption carried over from the bar -- if a faster setting
// makes the keyboard slower, flip this one constant.
const SPEED_MIN=1, SPEED_MAX=10;
const KB_SPEED_INVERTED=true;
const toWireSpeed=v=>SPEED_MIN+SPEED_MAX-v;          // UI "faster" -> wire value

// Which modes animate. Speed is meaningless for a solid colour, and offering a
// control that does nothing is the bug we just fixed for effect colours.
const CHIN_ANIMATED=['breathing','wave','clash','catchup'];

function speedSlider(id,value){
  return `<div class="row"><span class="lbl">Speed</span>
      <span class="kv">${value} / ${SPEED_MAX}</span></div>
    <input type="range" id="${id}" min="${SPEED_MIN}" max="${SPEED_MAX}" step="1" value="${value}">
    <div class="hint"><span>slower</span><span style="margin-left:auto">faster</span></div>`;
}

function picker(id,hex,label='Colour'){
  const v=hex2rgb(hex);
  return `<div class="pick" data-picker="${id}">
    <div class="row"><span class="lbl">${label}</span>
      <span class="kv"><span class="pv" data-pv style="background:${hex}"></span><span data-hexlbl>${hex}</span></span></div>
    ${CHAN.map(([k,L],i)=>`<div class="pickrow"><span class="lbl">${L}</span>
      <input type="range" class="ch" data-ch="${k}" min="0" max="255" value="${v[i]}">
      <span class="val" data-val="${k}">${v[i]}</span></div>`).join('')}
    <div class="row"><span class="lbl">Hex</span>
      <input type="text" class="hexin" data-hexin value="${hex}" maxlength="7" spellcheck="false"></div>
  </div>`;
}

async function api(path,opts){
  try{const r=await fetch(path,opts);return await r.json();}
  catch(e){return null;}
}
async function refreshState(){
  const d=await api('/api/state');
  if(!d){S.status={offline:true};render();return;}
  S.state=d.state||{};S.profile=d.profile||{};S.drift=d.drift||{};S.status=d.status||{};
  S.health=await api('/api/health');
  const pz=await api('/api/presets');
  if(pz){S.presets=pz.presets||[];S.activePreset=pz.active;S.button=pz.button||{};
    S.native=pz.native||[];S.nativeActive=pz.native_active||null;
    S.buttonCycle=pz.button_cycle||'native';}
  if(!Object.keys(S.effParams).length){
    const ep=await api('/api/rgb/effects'); if(ep)S.effParams=ep;
  }
  const pr=d.profile||{};
  if(pr.chin_mode!==undefined&&!S.chinTouched){
    S.chin={mode:pr.chin_mode,color:pr.chin_color||'#8CBF73',
            bri:pr.chin_brightness??100,speed:pr.chin_speed??5};
  }
  const l=await api('/api/lpp');
  S.lpp=l||{running:false};
  const gp=await api('/api/gpu');if(gp)S.gpu=gp;
  const lk=await api('/api/locks');if(lk)S.locks=lk;
  const bl=await api('/api/battery-lighting');if(bl)S.battLight=bl;
  const ps=await api('/api/power-saver');if(ps)S.saver=ps;
  const ic=await api('/api/icc');if(ic)S.icc=ic;
  if(!S.dispDrag){const dm=await api('/api/display');if(dm)S.display=dm;}
  const fd=await api('/api/found');if(fd)S.found=fd;
  // Defensive: this runs inside the shared state refresh, so anything that
  // throws here blanks the WHOLE app, not just the fan page. A presets map
  // without 'balanced' used to do exactly that.
  const f=await api('/api/fan');
  if(f){const fb=(f.presets&&f.presets.balanced)||{};
    S.fan=Object.assign(S.fan||{},f,
      {cpu:(S.fanDirty&&S.fan?S.fan.cpu:f.cpu)||fb.cpu||null,
       gpu:(S.fanDirty&&S.fan?S.fan.gpu:f.gpu)||fb.gpu||null});}
  if(S.lppFan===null&&typeof S.lpp.fan==='number')S.lppFan=S.lpp.fan;
  if(S.section==='lpp'&&!S.lpp.present)S.section='overview';
  render();
}
async function poll(){
  const t=await api('/api/telemetry');
  if(t){
    S.tel=t;S.status.offline=false;
    const push=(k,v)=>{if(v===null||v===undefined)return;
      const a=S.hist[k];a.push(v);if(a.length>60)a.shift();};
    push('pkg',t.package_w);push('cpu',t.cpu_temp_c);push('gpu',t.gpu_temp_c);
  }else{S.status.offline=true;}
  renderTitlebar();renderHealth();
  paintTelemetry();
}
async function applySettings(settings,persist=true){
  S.applyResult={pending:true};render();
  const d=await api('/api/apply',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({settings,persist})});
  if(!d){S.applyResult={failed:[{setting:'daemon',error:'no response'}]};render();return;}
  if(d.state)S.state=d.state;
  const failed=(d.changes||[]).filter(c=>!c.ok);
  const applied=(d.changes||[]).filter(c=>c.ok);
  S.applyResult=failed.length?{failed,applied}:{ok:true,applied};
  await refreshState();
  // keep the result visible after refreshState re-renders
  setTimeout(()=>{if(S.applyResult&&S.applyResult.ok){S.applyResult=null;render();}},4000);
}

// ── render ──
function render(){
  $('#nav').innerHTML=NAV.filter(n=>!n.optional||S.lpp.present).map(n=>`<button class="nav-item"
    data-sec="${n.id}" title="${n.name}"${S.section===n.id?' aria-current="page"':''}>${NAV_ICON[n.id]||''}<span
    class="nl">${n.name}</span></button>`).join('');
  const cur=NAV.find(n=>n.id===S.section);
  $('#secName').textContent=cur.name;$('#secSub').textContent=cur.sub;
  renderTitlebar();renderVizSwitch();renderHealth();renderBanners();
  $('#view').innerHTML=({overview:vOverview,perf:vPerf,batt:vBatt,fans:vFans,light:vLight,lpp:vLpp,sys:vSys})[S.section]();
  paintTelemetry();bind();syncRanges();
}
// Title bar: the device it is running on, and the three things that decide
// whether a setting takes effect -- the daemon, the custom-profile latch (PL
// writes are ignored without it) and the PL1 the EC holds.
function renderTitlebar(){
  const s=S.status,d=s.device||{},st=S.state||{};
  $('#tbDevice').textContent=[d.model,d.ec_firmware&&('EC '+d.ec_firmware),d.kernel]
    .filter(Boolean).join(' · ');
  const off=!!s.offline,latch=st.custom_profile,pl1=st.cpu_pl1;
  $('#tbStatus').innerHTML=
    `<span class="chip ${off?'bad':'live'}"><span class="dot"></span>${off?'daemon offline':'daemon running'}</span>`+
    (latch===undefined||latch===null?'':
      `<span class="chip${latch?'':' warn'}" title="${latch?'Power-limit writes take effect':
        'Power-limit writes are ignored until the custom profile is armed'}">${latch?'custom profile armed':'custom profile off'}</span>`)+
    (typeof pl1==='number'?`<span class="chip">PL1 ${pl1} W</span>`:'');
}
function renderHealth(){
  const s=S.status,off=s.offline;
  const items=[['driver',!!s.driver_loaded],['hwmon',!!s.hwmon],['EC',!!s.ec_available]];
  const hz=S.health, bad=off||items.some(([,ok])=>!ok)||(hz&&!hz.ok);
  $('#health').innerHTML=`<div class="hrow" title="${off?'daemon offline':bad?'a check is failing':'all checks ok'}">
      <span class="led${bad?' bad':''}"></span><span class="name">hydroc-server</span>
      <span class="st${bad?' bad':''}">${off?'offline':bad?'degraded':'running'}</span></div>
    <div class="hl">${items.map(([n,ok])=>`<span${ok?'':' class="bad"'}>${n} ${ok?'ok':'down'}</span>`).join(' · ')}
    ${(hz&&!hz.ok)?`<br>${hz.failed} check${hz.failed===1?'':'s'} failing — see the banner`:''}</div>`;
}
function renderBanners(){
  let h='';
  // A system update breaking the driver shows up as "hwmon down", which tells a
  // user nothing about what to do. Say what broke, why, and offer the fix.
  const hz=S.health;
  if(hz&&!hz.ok){
    const bad=(hz.checks||[]).filter(c=>!c.ok&&!c.optional);
    h+=`<div class="banner bad"><div style="flex:1">
      <b>${bad.length} thing${bad.length===1?'':'s'} not working.</b>
      ${bad.map(c=>`<div class="drift" style="margin-top:5px">
        <b>${esc(c.name)}</b> — ${esc(c.detail)}${c.remedy?`<br>${esc(c.remedy)}`:''}</div>`).join('')}
      </div>${hz.repairable?`<button class="btn btn-primary" id="repair">Repair</button>`:''}</div>`;
  }
  const rp=S.repair;
  if(rp){
    h+=`<div class="banner ${rp.pending?'warn':(rp.ok?'':'bad')}"
      ${rp.ok&&!rp.pending?'style="background:color-mix(in oklab,var(--color-accent) 12%,transparent);box-shadow:inset 0 0 0 1px var(--color-accent)"':''}>
      <div style="flex:1">${rp.pending
        ? 'Rebuilding the kernel module… this takes a minute.'
        : (rp.ok ? '<b>Repaired.</b> The module was rebuilt and reloaded.'
                 : '<b>Repair failed.</b>')}
      ${rp.output?`<pre class="drift" style="white-space:pre-wrap;margin-top:6px">${esc(rp.output)}</pre>`:''}
      ${rp.error?`<div class="drift">${esc(rp.error)}</div>`:''}</div></div>`;
  }
  const ar=S.applyResult;
  if(ar){
    if(ar.pending){
      h+=`<div class="banner warn"><div style="flex:1">Applying…</div></div>`;
    } else if(ar.ok){
      h+=`<div class="banner" style="background:color-mix(in oklab,var(--color-accent) 12%,transparent);
        box-shadow:inset 0 0 0 1px var(--color-accent)"><div style="flex:1">
        <b>Applied.</b> ${ar.applied.length} setting${ar.applied.length===1?'':'s'} written and verified.</div></div>`;
    } else {
      h+=`<div class="banner bad"><div style="flex:1">
        <b>${ar.failed.length} setting${ar.failed.length===1?'':'s'} could not be applied.</b>
        ${ar.applied&&ar.applied.length?` ${ar.applied.length} succeeded.`:''}
        <div class="drift">${ar.failed.map(f=>
          `${esc(f.setting)} — ${esc(f.error||'failed')}`).join('<br>')}</div></div>
        <button class="btn btn-secondary" id="dismiss">Dismiss</button></div>`;
    }
  }
  if(S.status.offline){
    h+=`<div class="banner bad"><div style="flex:1"><b>Daemon not reachable.</b>
      Telemetry and controls are unavailable.
      <div class="drift">start it with &nbsp;<span class="kv">sudo python3 -m hydroc.server</span></div></div></div>`;
  } else if(!S.status.ec_available){
    h+=`<div class="banner warn"><div style="flex:1"><b>EC unavailable — ${esc(S.status.ec_error||'')}</b>
      CPU power limits cannot be read or written. Everything else works.</div></div>`;
  }
  const dk=Object.keys(S.drift||{});
  if(dk.length){
    h+=`<div class="banner warn"><div style="flex:1">
      <b>EC reverted at power-on.</b> ${dk.length} setting${dk.length>1?'s':''} differ from your saved profile —
      the EC keeps these in volatile memory.
      <div class="drift">${dk.map(k=>`${k}: <s>${esc(num(S.drift[k].actual))}</s> → ${esc(num(S.drift[k].desired))}`).join(' &nbsp;·&nbsp; ')}</div>
      </div><button class="btn btn-primary" id="reapply">Re-apply</button></div>`;
  }
  $('#banners').innerHTML=h;
}

// ── sections ──
// ── readings: Gauge · Bars · Ramp · Radial (GUI polish design) ──────────────
// Picked in the title bar. A display preference, so it lives in the browser,
// not the hardware profile: it is not a setting and must never show as drift.
// Every storage access is guarded -- the design read it unguarded, and where
// storage is blocked that one line stopped the whole page from drawing.
const VIZ={

// Battery is not a temperature: it keeps the accent colour in every style.
const READINGS=[
 {id:'cpu_temp_c',label:'CPU package',unit:'°C',max:100,temp:true},
 {id:'gpu_temp_c',label:'GPU',unit:'°C',max:100,temp:true},
 {id:'capacity_pct',label:'Battery',unit:'%',max:100,temp:false}];
const READ_BY_ID=Object.fromEntries(READINGS.map(r=>[r.id,r]));
const clamp01=x=>Math.max(0,Math.min(1,x));
const rdVal=r=>{const v=S.tel[r.id];return typeof v==='number'?v:null;};
const rdText=v=>v===null?'—':String(Math.round(v));
const rdColor=(r,v)=>v===null?'var(--faint)':r.temp?tempColorC(v):'var(--accent)';
const segColor=(r,frac)=>r.temp?tempColorC(frac*100):'var(--accent)';

const DIAL_R=50;
const dialPath=r=>{const a=r*0.70710678;return `M ${-a} ${a} A ${r} ${r} 0 1 1 ${a} ${a}`;};
const dialPt=(rr,f)=>{const a=(135+f*270)*Math.PI/180;return [rr*Math.cos(a),rr*Math.sin(a)];};
function dialGauge(r){
  let ticks='';
  for(let v=0;v<=100;v+=5){const major=v%10===0;
    const [x1,y1]=dialPt(DIAL_R-1,v/100),[x2,y2]=dialPt(major?DIAL_R-9:DIAL_R-5.5,v/100);
    ticks+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"
      stroke="var(--surface-3)" stroke-width="${major?1.4:0.7}" opacity="${major?0.85:0.42}"/>`;}
  const [z0x,z0y]=dialPt(DIAL_R+15,0),[z1x,z1y]=dialPt(DIAL_R+15,1);
  const arc=(cls,w,op)=>`<path class="${cls}" d="${dialPath(DIAL_R)}" fill="none" stroke-width="${w}"
    stroke-linecap="round" pathLength="270" stroke-dasharray="0 270"${op?` opacity="${op}"`:''}/>`;
  return `<div class="gauge"><svg width="150" height="128" viewBox="-72 -68 144 126" aria-hidden="true">
      <path d="${dialPath(DIAL_R)}" fill="none" stroke="var(--surface-2)" stroke-width="7" stroke-linecap="round"/>
      ${ticks}${arc('rd-glow',16,0.13)}${arc('rd-arc',7)}
      <circle class="rd-end" r="8.5" opacity="0.22"/><circle class="rd-end" r="3.2"/>
      <text x="${z0x.toFixed(1)}" y="${(z0y+3).toFixed(1)}" fill="var(--faint)" font-size="8.5"
        font-family="var(--font-mono)" text-anchor="middle">0</text>
      <text x="${z1x.toFixed(1)}" y="${(z1y+3).toFixed(1)}" fill="var(--faint)" font-size="8.5"
        font-family="var(--font-mono)" text-anchor="middle">${r.max}</text>
      <text class="rd-val" text-anchor="middle" x="0" y="-4" font-size="34" font-weight="600"
        font-family="var(--font-mono)" letter-spacing="-0.02em">—</text>
      <text text-anchor="middle" x="0" y="13" fill="var(--faint)" font-size="10.5" font-family="var(--font-mono)">${r.unit}</text>
    </svg><div class="g-label">${r.label}</div></div>`;
}
const RADIAL_N=24, RADIAL_R=46;
function radialGauge(r){
  const span=360/RADIAL_N, gap=2.4; let segs='';
  for(let i=0;i<RADIAL_N;i++){
    const a0=(i*span+gap/2-90)*Math.PI/180, a1=((i+1)*span-gap/2-90)*Math.PI/180;
    segs+=`<path class="rd-seg" d="M ${(RADIAL_R*Math.cos(a0)).toFixed(1)} ${(RADIAL_R*Math.sin(a0)).toFixed(1)}
      A ${RADIAL_R} ${RADIAL_R} 0 0 1 ${(RADIAL_R*Math.cos(a1)).toFixed(1)} ${(RADIAL_R*Math.sin(a1)).toFixed(1)}"
      fill="none" stroke="var(--surface-2)" stroke-width="8.5" stroke-linecap="round"/>`;}
  return `<div class="gauge"><svg width="152" height="152" viewBox="-64 -64 128 128" aria-hidden="true">
      <circle cx="0" cy="0" r="${RADIAL_R}" fill="none" stroke="var(--border-soft)" stroke-width="1"/>${segs}
      <text class="rd-val" text-anchor="middle" x="0" y="-2" font-size="32" font-weight="600"
        font-family="var(--font-mono)" letter-spacing="-0.02em">—</text>
      <text text-anchor="middle" x="0" y="15" fill="var(--faint)" font-size="10.5" font-family="var(--font-mono)">${r.unit}</text>
    </svg><div class="g-label">${r.label}</div></div>`;
}
function barGauge(r){
  const q=[0,.25,.5,.75,1];
  return `<div class="tbar">
      <div class="tbar-head"><span class="g-label">${r.label}</span>
        <span class="tbar-num"><span class="rd-val">—</span><span class="tbar-unit">${r.unit}</span></span></div>
      <div class="tbar-track" role="img" aria-label="${r.label}">
        ${q.map(f=>`<span class="tbar-tick" style="left:${f*100}%"></span>`).join('')}
        <div class="tbar-fill" style="width:0"><span class="tbar-tip"></span></div></div>
      <div class="tbar-scale">${q.map(f=>`<span>${Math.round(f*r.max)}</span>`).join('')}</div>
    </div>`;
}
const RAMP_N=20;
function rampGauge(r){
  return `<div class="tramp">
      <div class="tramp-num"><span class="rd-val">—</span><span class="tramp-unit">${r.unit}</span></div>
      <div class="tramp-row"><div class="tramp-scale"><span>${r.max}</span><span>${r.max/2}</span><span>0</span></div>
        <div class="tramp-col" role="img" aria-label="${r.label}">${
          Array.from({length:RAMP_N},()=>'<span class="tramp-seg"></span>').join('')}</div></div>
      <div class="g-label">${r.label}</div></div>`;
}
const VIZ_BUILD={gauge:dialGauge,bars:barGauge,ramp:rampGauge,radial:radialGauge};
function readingCard(r){
  return `<div class="card rd-card viz-pop" data-rd="${r.id}" data-style="${S.viz}">${VIZ_BUILD[S.viz](r)}</div>`;
}
// In place, every poll: rebuilding would restart the transitions each second.
function paintReadings(){
  document.querySelectorAll('[data-rd]').forEach(el=>{
    const r=READ_BY_ID[el.dataset.rd], v=rdVal(r), f=v===null?0:clamp01(v/r.max), c=rdColor(r,v);
    el.querySelectorAll('.rd-val').forEach(t=>{t.textContent=rdText(v);
      if(t.tagName==='text')t.setAttribute('fill',c);});
    const num=el.querySelector('.tbar-num,.tramp-num'); if(num)num.style.color=c;
    switch(el.dataset.style){
    case 'gauge':{
      el.querySelectorAll('.rd-arc,.rd-glow').forEach(p=>{
        p.setAttribute('stroke-dasharray',`${(f*270).toFixed(1)} 270`);p.setAttribute('stroke',c);});
      el.querySelector('.rd-glow').style.display=f>0.01?'':'none';
      const [ex,ey]=dialPt(DIAL_R,f);
      el.querySelectorAll('.rd-end').forEach(e=>{e.setAttribute('cx',ex.toFixed(1));
        e.setAttribute('cy',ey.toFixed(1));e.setAttribute('fill',c);});
      break;}
    case 'radial':
      el.querySelectorAll('.rd-seg').forEach((s,i)=>{const mid=(i+0.5)/RADIAL_N;
        s.setAttribute('stroke',v!==null&&mid<=f?segColor(r,mid):'var(--surface-2)');});
      break;
    case 'bars':{
      const fill=el.querySelector('.tbar-fill'), tip=el.querySelector('.tbar-tip');
      fill.style.width=(f*100).toFixed(1)+'%';fill.style.background=c;
      tip.style.background=c;tip.style.color=c;
      break;}
    case 'ramp':{
      const on=Math.round(f*RAMP_N), segs=[...el.querySelectorAll('.tramp-seg')].reverse();
      segs.forEach((s,i)=>{const lit=v!==null&&i<on, sc=segColor(r,(i+0.5)/RAMP_N);
        s.style.background=lit?sc:'';
        s.style.boxShadow=lit&&i===on-1?`0 0 10px ${sc},0 0 2px ${sc}`:'';});
      break;}
    }
  });
}

// ── Fans ────────────────────────────────────────────────────────────────────
// The editor works in DUTY PERCENT, not rpm. We command duty; rpm is a
// measurement that drifts with dust, altitude and fan age, so an rpm axis would
// promise a setpoint we cannot hold. Measured rpm is overlaid read-only instead.
const CW=520,CH=210,CPAD={l:34,r:10,t:12,b:24},TMIN=30,TMAX=105;
function cx(t){return CPAD.l+(t-TMIN)/(TMAX-TMIN)*(CW-CPAD.l-CPAD.r);}
function cy(d){return CH-CPAD.b-(d/100)*(CH-CPAD.t-CPAD.b);}
function curveChart(fan){
  const pts=S.fan[fan]||[],floor=S.fan.min_duty||25;
  const live=fan==='cpu'?{t:S.tel.cpu_temp_c,p:S.tel.pwm1}:{t:S.tel.gpu_temp_c,p:S.tel.pwm2};
  const path=pts.map((p,i)=>`${i?'L':'M'}${cx(p[0]).toFixed(1)},${cy(p[2]).toFixed(1)}`).join('');
  const grid=[40,50,60,70,80,90,100].map(t=>
    `<line x1="${cx(t)}" y1="${CPAD.t}" x2="${cx(t)}" y2="${CH-CPAD.b}" stroke="var(--color-divider)"/>
     <text x="${cx(t)}" y="${CH-8}" fill="var(--color-neutral-400)" font-size="9" text-anchor="middle">${t}</text>`).join('');
  const yax=[0,25,50,75,100].map(d=>
    `<line x1="${CPAD.l}" y1="${cy(d)}" x2="${CW-CPAD.r}" y2="${cy(d)}" stroke="var(--color-divider)"/>
     <text x="${CPAD.l-5}" y="${cy(d)+3}" fill="var(--color-neutral-400)" font-size="9" text-anchor="end">${d}</text>`).join('');
  const dots=pts.map((p,i)=>`<circle class="cpt" data-fan="${fan}" data-i="${i}"
     cx="${cx(p[0]).toFixed(1)}" cy="${cy(p[2]).toFixed(1)}" r="5"><title>${p[0]}°C → ${p[2]}%  (falls back below ${p[1]}°C)</title></circle>`).join('');
  const now=(live.t!=null&&live.p!=null)?
    `<circle cx="${cx(live.t).toFixed(1)}" cy="${cy(Math.round(live.p*200/255)/2).toFixed(1)}"
       r="4" fill="none" stroke="var(--color-warn)" stroke-width="2"/>`:'';
  return `<svg class="curvechart" viewBox="0 0 ${CW} ${CH}" data-curve="${fan}">
    <rect x="${CPAD.l}" y="${cy(floor)}" width="${CW-CPAD.l-CPAD.r}" height="${CH-CPAD.b-cy(floor)}"
      fill="var(--color-danger-tint)"/>
    ${yax}${grid}
    <path d="${path}" fill="none" stroke="var(--color-accent)" stroke-width="2"/>
    ${dots}${now}</svg>`;
}
function vFans(){
  if(!S.fan)return `<div class="card">reading fan state…</div>`;
  if(S.state.fan_mode==='manual'&&!(S.fan.cpu&&S.fan.gpu))

      <div class="lbl">Manual mode is on but no curve could be read. Switch to Auto

  const manual=S.state.fan_mode==='manual',floor=S.fan.min_duty||25;
  return `
  <div class="card">
    <div class="row"><div class="kick">Fan control</div>
      <div class="seg" id="fanmode">
        <button data-v="auto" aria-pressed="${!manual}">Auto</button>
        <button data-v="manual" aria-pressed="${manual}">Manual</button></div></div>
    <div class="lbl">Auto leaves the fans to the firmware. Manual writes your curve into the
      EC's own tables, honouring duty and fall-back temperature.</div>
    <div class="lbl">No point may go below <b>${floor}%</b>. A new duty takes a few seconds
      to reach at about ${S.fan.slew_pct_per_s}%/s.</div>
  </div>
  ${manual?`
  <div class="card" style="margin-top:var(--space-4)">
    <div class="row"><div class="kick">Load a curve</div>
      <div class="seg" id="fanpreset">${['office','balanced','performance'].map(n=>
        `<button data-v="${n}">${n[0].toUpperCase()+n.slice(1)}</button>`).join('')}</div></div>
    <div class="lbl">Each power preset carries a matching curve. Picking one here loads it for
      editing; drag any point up or down to change its duty.</div>
  </div>
  <div class="card" style="margin-top:var(--space-4)">
    <div class="row"><div class="kick">CPU fan</div><span class="kv"><span data-t="fan1_rpm">—</span> rpm</span></div>
    ${curveChart('cpu')}
    <div class="lbl">Temperature °C across, duty % up. The ring is where the machine is right now.</div>
  </div>
  <div class="card" style="margin-top:var(--space-4)">
    <div class="row"><div class="kick">GPU fan</div><span class="kv"><span data-t="fan2_rpm">—</span> rpm</span></div>
    ${curveChart('gpu')}
  </div>
  <div class="card" style="margin-top:var(--space-4)">
    <button class="btn" id="fanapply"${S.fanDirty?'':' disabled'}>Apply curve</button>
    <span class="lbl" style="margin-left:10px">${S.fanDirty?'unsaved changes':'no changes'}</span>
  </div>`:''}`;
}

// Monotonic by construction: dragging a point drags its neighbours out of the
// way rather than letting the user build a curve the daemon will reject. The
// floor is clamped here too, so the invalid state is unreachable in the UI
// instead of being caught after the fact.
function setDuty(fan,i,q){
  const a=S.fan[fan],floor=S.fan.min_duty||25;
  q=Math.max(floor,Math.min(100,Math.round(q)));
  a[i][2]=q;
  for(let j=i-1;j>=0;j--)a[j][2]=Math.min(a[j][2],q);
  for(let j=i+1;j<a.length;j++)a[j][2]=Math.max(a[j][2],q);
  S.fanDirty=true;
}
function redrawCurve(fan){
  const svg=document.querySelector(`[data-curve="${fan}"]`);if(!svg)return;
  const pts=S.fan[fan];
  svg.querySelector('path').setAttribute('d',
    pts.map((p,i)=>`${i?'L':'M'}${cx(p[0]).toFixed(1)},${cy(p[2]).toFixed(1)}`).join(''));
  svg.querySelectorAll('.cpt').forEach(c=>{
    const i=+c.dataset.i;c.setAttribute('cy',cy(pts[i][2]).toFixed(1));
    const t=c.querySelector('title');
    if(t)t.textContent=`${pts[i][0]}°C → ${pts[i][2]}%  (falls back below ${pts[i][1]}°C)`;});
}
function bindFans(){
  const mode=$('#fanmode');
  if(mode)mode.onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;
    if(b.dataset.v==='manual'){
      applySettings({fan_mode:'manual',fan_curve_cpu:S.fan.cpu,fan_curve_gpu:S.fan.gpu});
    }else{applySettings({fan_mode:'auto'});}
    S.fanDirty=false;};
  const pre=$('#fanpreset');
  if(pre)pre.onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;
    const c=S.fan.presets[b.dataset.v];if(!c)return;
    S.fan.cpu=c.cpu.map(p=>p.slice());S.fan.gpu=c.gpu.map(p=>p.slice());
    S.fanDirty=true;render();};
  const ap=$('#fanapply');
  if(ap)ap.onclick=()=>{S.fanDirty=false;
    applySettings({fan_mode:'manual',fan_curve_cpu:S.fan.cpu,fan_curve_gpu:S.fan.gpu});};

  document.querySelectorAll('[data-curve]').forEach(svg=>{
    let dragging=null;
    const dutyAt=ev=>{const r=svg.getBoundingClientRect();
      const yv=(ev.clientY-r.top)/r.height*CH;
      return (CH-CPAD.b-yv)/(CH-CPAD.t-CPAD.b)*100;};
    svg.addEventListener('pointerdown',ev=>{
      const c=ev.target.closest('.cpt');if(!c)return;
      dragging={fan:c.dataset.fan,i:+c.dataset.i};
      svg.setPointerCapture(ev.pointerId);ev.preventDefault();});
    svg.addEventListener('pointermove',ev=>{
      if(!dragging)return;
      setDuty(dragging.fan,dragging.i,dutyAt(ev));redrawCurve(dragging.fan);});
    svg.addEventListener('pointerup',ev=>{
      if(!dragging)return;dragging=null;
      try{svg.releasePointerCapture(ev.pointerId);}catch(_){}
      render();});
  });
}

// ── GPU mode ────────────────────────────────────────────────────────────────
// Deliberately two-step. Everything else in this app writes volatile EC state
// that a power cycle undoes; this writes non-volatile firmware, so it should not
// be one stray click away. The mode shown is read from the firmware variables,
// never from stored intent.
// ── what the hardware was holding before we wrote to it ─────────────────────
// hydroc-apply overwrites stored intent into the hardware at every boot, which
// is right -- almost nothing here survives a power cycle. The cost was that
// nobody could tell which settings HAD survived, because our own write landed
// first. This shows the reading taken immediately before that write, and only
// when it disagreed: a setting the hardware kept on its own is a setting we
// should be reading rather than applying, the way GPU mode already is.
function foundCard(){
  const f=S.found;
  if(!f||f.none||!f.differences||!f.differences.length)return '';
  return `<div class="card" style="margin-top:var(--space-4)">
    <div class="row"><div class="kick">Hardware differed at ${esc(f.reason||'apply')}</div>
      <span class="kv">${esc((f.when||'').replace('T',' '))}</span></div>
    <div class="lbl">Values read before your profile was applied.</div>
    ${f.differences.map(d=>`<div class="row" style="margin-top:var(--space-2)">
      <span>${esc(d.setting)}</span>
      <span class="kv">had ${esc(JSON.stringify(d.found))} · wanted ${esc(JSON.stringify(d.intent))}</span>
      </div>`).join('')}
  </div>`;
}

// ── lock keys ───────────────────────────────────────────────────────────────
// Control Center's Num Lock switch is a synthesised keypress, not firmware.
// Ours does the same into the built-in keyboard's own input device, and the
// state shown is the keyboard LED -- what the compositor actually holds for
// that keyboard. Picking On/Off sets it now and makes it the default at boot,
// resume and login; "Leave alone" hands it back to the desktop.
const LOCKNAMES={num:'Num Lock',caps:'Caps Lock'};
function locksCard(){
  const l=S.locks;
  if(!l)return '';
  if(!l.available)return `<div class="card" style="margin-top:var(--space-4)">
    <div class="kick">Lock keys</div><div class="lbl">${esc(l.error||'keyboard not found')}</div></div>`;
  const d=l.defaults||{};
  return `<div class="card" style="margin-top:var(--space-4)">
    <div class="kick">Lock keys · built-in keyboard</div>
    <div class="lbl">Sets it now and restores it at boot, resume and every login.
      Leave alone lets the desktop decide.</div>
    ${Object.keys(LOCKNAMES).map(k=>{const cur=d[k]===true?'on':d[k]===false?'off':'none';
      return `<div class="row" style="margin-top:var(--space-3)">
      <div><div style="font-size:13.5px">${LOCKNAMES[k]}</div>
        <div class="lbl kv" style="font-size:10.5px">now ${l[k]===null?'unknown':l[k]?'on':'off'}</div></div>
      <div class="seg" data-lock="${k}">${[['none','Leave alone'],['on','On'],['off','Off']].map(([v,n])=>
        `<button data-v="${v}" aria-pressed="${cur===v}">${n}</button>`).join('')}</div></div>`;}).join('')}
    ${S.lockMsg?`<div class="lbl" style="margin-top:var(--space-2);color:${
      S.lockMsg.bad?'var(--color-danger)':'var(--color-accent)'}">${esc(S.lockMsg.text)}</div>`:''}
  </div>`;
}
function bindLocks(){
  document.querySelectorAll('[data-lock]').forEach(seg=>seg.onclick=async e=>{
    const b=e.target.closest('[data-v]');if(!b)return;
    const v=b.dataset.v, lock=seg.dataset.lock;
    const d=await api('/api/locks',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({lock,on:v==='none'?null:v==='on'})});
    if(d&&d.locks)S.locks=d.locks;
    S.lockMsg=d&&d.ok?{text:`${LOCKNAMES[lock]}: ${v==='none'?'left to the desktop':v}`}

function bindGpu(){
  const seg=$('#gpumode');
  if(seg)seg.onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;
    S.gpuMsg=null;
    if(b.dataset.v===S.gpu.mode){S.gpuPending=null;render();return;}
    S.gpuPending=b.dataset.v;render();};
  const c=$('#gpucancel');if(c)c.onclick=()=>{
    S.gpuPending=null;S.gpuMsg=null;S.gpuAck=false;render();};
  const ack=$('#gpuack');
  if(ack)ack.onchange=e=>{S.gpuAck=e.target.checked;render();};
  const ok=$('#gpuconfirm');
  if(ok){
    // The checkbox only exists when there are risks; with none, nothing gates.
    const risks=((S.gpu.modes||[]).find(m=>m.id===S.gpuPending)||{}).risks||[];
    ok.disabled=risks.length>0&&!S.gpuAck;
    ok.onclick=async()=>{
    S.gpuMsg={text:'writing firmware…'};render();
    const d=await api('/api/gpu/set',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({mode:S.gpuPending,confirm:true,acknowledge_risks:!!S.gpuAck})});
    if(d&&d.ok){
      S.gpuPending=null;S.gpuAck=false;
      S.gpuMsg={text:(d.message||'written — reboot to apply')
                     +(d.recovery?'  '+d.recovery:'')};
      const g=await api('/api/gpu');if(g)S.gpu=g;
    }else{
      S.gpuMsg={text:'failed: '+((d&&d.error)||'no response'),bad:true};
    }
    render();};}
}

// ── telemetry paint (no re-render, so sliders keep focus) ──
// The design's thresholds, in degrees: amber above 78 °C, red above 88 °C.
function tempColorC(c){
  return c>88?'var(--danger)':c>78?'var(--warn)':'var(--accent)';
}
function paintChart(){
  const el=$('#pwrchart'); if(!el) return;
  const h=S.hist.pkg;
  // Match the viewBox to the element's real pixel width so the coordinate
  // system is 1:1. With a fixed viewBox and width:100% the SVG scales
  // non-uniformly, which stretches text glyphs and dash patterns horizontally.
  const H=120,PAD=6;
  const W=Math.max(120,Math.round(el.clientWidth||el.getBoundingClientRect().width||300));
  el.setAttribute('viewBox',`0 0 ${W} ${H}`);
  if(S.viz==='radial'){el.innerHTML=polarChart(h,W,H);return;}
  const lim=S.state.cpu_pl1||0;
  // PL2 only earns a line when it actually differs from PL1 -- when they match
  // (the default) a second line is noise. PL4 is deliberately not drawn: it
  // governs sub-second peaks, and at 1 Hz every sample is already a one-second
  // average, so the trace can never reach it. A line it cannot touch would read
  // as headroom rather than as a different timescale.
  const lim2=(S.state.cpu_pl2&&S.state.cpu_pl2!==lim)?S.state.cpu_pl2:0;
  const peak=Math.max(lim*1.25||0,lim2*1.15||0,...h,20);
  const y=v=>H-PAD-(v/peak)*(H-PAD*2);
  const x=i=>h.length<2?0:(i/(h.length-1))*W;
  let g='';
  [0.5,1].forEach(f=>{const yy=y(peak*f).toFixed(1);
    g+=`<line class="grid" x1="0" y1="${yy}" x2="${W}" y2="${yy}"></line>`
      +`<text class="chartlbl" x="2" y="${(+yy-3).toFixed(1)}">${Math.round(peak*f)}W</text>`;});
  let body='';
  if(h.length>1&&S.viz==='bars'){
    // One bar per one-second sample in 60 fixed slots, filling from the
    // right, so a fresh page does not draw five bars across the whole width.
    const bw=W/60, x0=(60-h.length)*bw;
    body=h.map((v,i)=>{const bh=Math.max(0,H-PAD-y(v)), last=i===h.length-1;
      return `<rect x="${(x0+i*bw+0.8).toFixed(1)}" y="${(H-PAD-bh).toFixed(1)}" width="${Math.max(1,bw-1.6).toFixed(1)}"
        height="${bh.toFixed(1)}" rx="1.5" fill="var(${last?'--accent-bright':'--accent'})"${last?' class="spark-pulse"':''}/>`;}).join('');
  }else if(h.length>1&&S.viz==='ramp'){
    // A heat strip: each second's cell as bright as its share of the scale.
    const cw=W/60, x0=(60-h.length)*cw;
    body=h.map((v,i)=>`<rect x="${(x0+i*cw).toFixed(1)}" y="${PAD}" width="${(cw+0.5).toFixed(1)}" height="${H-PAD*2}"
      fill="var(--accent)" opacity="${(0.05+clamp01(v/peak)*0.92).toFixed(2)}"/>`).join('');
  }else if(h.length>1){
    const pts=h.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    body=`<polygon class="fill" points="0,${H} ${pts} ${W},${H}"></polygon>`
        +`<polyline class="line" points="${pts}"></polyline>`
        +`<circle class="end" cx="${W}" cy="${y(h[h.length-1]).toFixed(1)}" r="2.6"></circle>`;
  }
  const lim2Line=lim2?`<line class="limit2" x1="0" y1="${y(lim2).toFixed(1)}" x2="${W}" y2="${y(lim2).toFixed(1)}"></line>
     <text class="chartlbl" text-anchor="end" x="${W-4}" y="${(y(lim2)-4).toFixed(1)}"
       style="fill:var(--color-info)">PL2 ${lim2} W</text>`:'';
  const limLine=lim?`<line class="limit" x1="0" y1="${y(lim).toFixed(1)}" x2="${W}" y2="${y(lim).toFixed(1)}"></line>
     <text class="chartlbl" text-anchor="end" x="${W-4}" y="${(y(lim)-4).toFixed(1)}"
       style="fill:var(--color-warn)">PL1 ${lim} W</text>`:'';
  el.innerHTML=g+body+lim2Line+limLine;
}
// Radial style: a polar histogram of the last minute -- one spoke per second,
// length proportional to power, inside a filled radar outline, with PL1 (and
// PL2 when it differs) as dashed rings. Same scale as the linear charts.
function polarChart(h,W,H){
  const lim=S.state.cpu_pl1||0, lim2=(S.state.cpu_pl2&&S.state.cpu_pl2!==lim)?S.state.cpu_pl2:0;
  const peak=Math.max(lim*1.25||0,lim2*1.15||0,...h,20);
  const cx=W/2, cy=H/2, Rmax=H/2-7, inner=11, n=Math.max(h.length,1);
  const rOf=v=>inner+clamp01(v/peak)*(Rmax-inner);
  const pt=(i,v)=>{const a=((i/n)*360-90)*Math.PI/180,rr=rOf(v);return [cx+rr*Math.cos(a),cy+rr*Math.sin(a)];};
  const rings=[0.25,0.5,0.75,1].map(f=>`<circle cx="${cx}" cy="${cy}" r="${rOf(peak*f).toFixed(1)}"
    fill="none" stroke="var(--surface-2)" stroke-width="1"/>`).join('');
  const ring=(v,col,dash)=>v?`<circle cx="${cx}" cy="${cy}" r="${rOf(v).toFixed(1)}" fill="none"
    stroke="var(${col})" stroke-width="1" stroke-dasharray="${dash}" opacity=".7"/>`:'';
  const spokes=h.map((v,i)=>{const [x0,y0]=pt(i,0),[x1,y1]=pt(i,v),last=i===h.length-1;
    return `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}"
      stroke="var(${last?'--accent-bright':'--accent'})" stroke-width="${last?2.1:1}" stroke-linecap="round"
      opacity="${(0.28+clamp01(v/peak)*0.72).toFixed(2)}"${last?' class="spark-pulse"':''}/>`;}).join('');
  const poly=h.length>2?`<polygon points="${h.map((v,i)=>pt(i,v).map(c=>c.toFixed(1)).join(',')).join(' ')}"
    fill="var(--accent)" opacity=".15"/>`:'';
  const key=(lim?`<text class="chartlbl" text-anchor="end" x="${W-4}" y="12" style="fill:var(--warn)">PL1 ${lim} W</text>`:'')
    +(lim2?`<text class="chartlbl" text-anchor="end" x="${W-4}" y="24" style="fill:var(--info)">PL2 ${lim2} W</text>`:'');
  return rings+ring(lim2,'--info','2 4')+ring(lim,'--warn','3 3')+poly+spokes+key;
}
function paintTelemetry(){
  paintReadings();
  document.querySelectorAll('[data-bar]').forEach(b=>{
    const v=S.tel[b.dataset.bar];
    b.style.width=(v===null||v===undefined?0:Math.max(0,Math.min(100,v/255*100)))+'%';
  });
  paintChart();
  // Volts per cell against the two limits. 3.00 V is a conventional Li-ion
  // cutoff and 4.450 the pack's rating, so the track spans what the cells
  // could do and the fill shows what the firmware allows.
  const VMIN=3.0, VCEIL=4.175, VRATE=4.45;
  const vpos=v=>Math.max(0,Math.min(100,(v-VMIN)/(VRATE-VMIN)*100));
  const vf=$('#vfill'), vc=$('#vceil'), vr=$('#vrate'), vn=$('#vnote');
  if(vf){
    const v=S.tel.volts_per_cell;
    vf.style.width=(v===null||v===undefined?0:vpos(v))+'%';
    vf.style.background=(v!==null&&v!==undefined&&v>VCEIL+0.005)
      ?'var(--color-warn)':'var(--color-accent)';
    if(vc)vc.style.left=vpos(VCEIL)+'%';
    if(vr)vr.style.left='calc(100% - 2px)';
    if(vn)vn.textContent=(v===null||v===undefined)?''
      :S.tel.current_ma>0&&S.tel.status==='Discharging'
        ? `Under a ${S.tel.current_ma} mA load, so this reads low — terminal voltage `
          +`includes the drop across the pack's own resistance. It recovers when the load does.`
      :S.tel.current_ma>0&&S.tel.status==='Charging'
        ? `Charging at ${S.tel.current_ma} mA, so this reads high for the same reason. `
          +`The resting voltage is lower than shown.`
        : 'At rest, so this is close to the cells\' true open-circuit voltage.';
  }

  // The seam, said plainly: the OS reports charge moving and none is.
  const fab=$('#fabricating');
  if(fab){
    const on=!!S.tel.fabricating;
    fab.style.display=on?'':'none';
    if(on)fab.textContent=
      `The battery is not charging. Current is 0 mA, and the reported figure has `
      +`climbed ${S.tel.coulomb_claimed_mah} mAh since this leg began while `
      +`${S.tel.coulomb_measured_mah} mAh actually moved. The charge ended; the number `
      +`is still going up.`;
  }
  const cr=$('#cratio');
  if(cr){
    const r=S.tel.coulomb_ratio;
    cr.textContent=(r===null||r===undefined)?'—':r.toFixed(3);
    cr.style.color=(r===null||r===undefined)?'':
      (r<0.85||r>1.15)?'var(--color-danger)':'var(--color-accent)';
  }
  document.querySelectorAll('[data-t]').forEach(el=>{
    const k=el.dataset.t;let v=S.tel[k];
    if(k==='ac_online')v=v===true?'yes':v===false?'no':'—';
    if(typeof v==='number')v=Number.isInteger(v)?v:v.toFixed(k==='volts_per_cell'?3:1);
    el.textContent=v===undefined||v===null?'—':v;
  });
}

    rb.disabled=true; S.repair={pending:true}; render();
    const d=await api('/api/repair',{method:'POST'});
    S.repair=d||{ok:false,error:'no response from the daemon'};
    S.repair.pending=false;
    if(d&&d.checks){S.health={checks:d.checks,
      ok:!d.checks.some(c=>!c.ok&&!c.optional),
      failed:d.checks.filter(c=>!c.ok&&!c.optional).length,
      repairable:d.checks.some(c=>!c.ok&&c.repair)};}
    render(); refreshState();
  };

  const preset=$('#preset');
  if(preset)preset.onclick=async e=>{const b=e.target.closest('[data-v]');
    if(!b||b.disabled)return;
    msg('#presetmsg','applying '+b.textContent+'…');
    const d=await api('/api/preset',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({preset:b.dataset.v})});
    // A preset takes the machine back off the EC, so the native row has
    // to clear here too or both rows show a selection at once.
    if(d&&d.state){S.state=d.state;S.activePreset=d.active;S.nativeActive=null;}
    msg('#presetmsg',d&&d.ok?`applied ${b.textContent}`
        :'failed: '+((d&&d.error)||'no response'),!(d&&d.ok));
    refreshState();};

  const native=$('#native');
  if(native)native.onclick=async e=>{const b=e.target.closest('[data-v]');
    if(!b||b.disabled)return;
    msg('#nativemsg','applying '+b.textContent+'…');
    const d=await api('/api/native',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({mode:b.dataset.v})});
    if(d&&d.state){S.state=d.state;S.nativeActive=d.active||null;}
    msg('#nativemsg',d&&d.ok?`applied ${b.textContent}`
        :'failed: '+((d&&d.error)||'no response'),!(d&&d.ok));
    refreshState();};

  const fb=$('#fanboost');
  if(fb)fb.onclick=async()=>{
    if(!S.nativeActive)return;
    msg('#nativemsg','applying…');
    const d=await api('/api/native',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({mode:S.nativeActive,boost:!S.state.fan_boost})});
    if(d&&d.state)S.state=d.state;
    msg('#nativemsg',d&&d.ok?`fan boost ${d.boost?'on':'off'}`
        :'failed: '+((d&&d.error)||'no response'),!(d&&d.ok));
    refreshState();};

  const bcycle=$('#bcycle');
  if(bcycle)bcycle.onclick=async e=>{const b=e.target.closest('[data-v]');if(!b)return;
    const d=await api('/api/button-cycle',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({cycle:b.dataset.v})});
    if(d&&d.ok){S.buttonCycle=d.cycle;render();}
    else msg('#bcyclemsg','failed: '+((d&&d.error)||'no response'),true);};

  const thr=$('#thr');
  if(thr)thr.onchange=()=>applySettings({charge_threshold:+thr.value});

  const pmode=$('#pmode');
  if(pmode)pmode.onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;
    applySettings({ac_auto_boot:b.dataset.v==='ac',usb_powershare_high:b.dataset.v==='usb'});};

  const kbtab=$('#kbtab');
  if(kbtab)kbtab.onclick=e=>{const b=e.target.closest('[data-v]');if(b){S.kbTab=b.dataset.v;render();}};
  const chin=$('#chin');
  if(chin)chin.onclick=e=>{const b=e.target.closest('[data-v]');
    if(b){S.chin.mode=b.dataset.v;S.chinTouched=true;render();}};
  const cb=$('#chinbri');if(cb)cb.oninput=()=>{S.chin.bri=+cb.value;};
  const chinSpd=$('#chinspeed');
  if(chinSpd)chinSpd.oninput=()=>{S.chin.speed=+chinSpd.value;S.chinTouched=true;
    chinSpd.previousElementSibling.querySelector('.kv').textContent=`${chinSpd.value} / ${SPEED_MAX}`;};
  const kbSpd=$('#kbspeed');
  if(kbSpd)kbSpd.oninput=()=>{S.kbSpeed=+kbSpd.value;
    kbSpd.previousElementSibling.querySelector('.kv').textContent=`${kbSpd.value} / ${SPEED_MAX}`;};

  // cooling dock
  // Live controls. Dragging only updates the readout -- sending on every
  // `input` would spam BLE writes across the drag -- and the value goes to the
  // dock on release. Bluetooth writes here are unacknowledged, so the message
  // says "sent", never "applied".
  const lppSend=async(body,label)=>{
    msg('#lppmsg','sending…');
    const d=await api('/api/lpp/set',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(d&&d.ok)S.lpp={...S.lpp,...d};
    msg('#lppmsg',d&&d.ok?`sent — ${label}`
        :'failed: '+((d&&d.error)||'no response'),!(d&&d.ok));
    if(d&&!d.ok)render();
  };
  const lf=$('#lppfan');
  if(lf){
    lf.oninput=()=>{S.lppFan=+lf.value;
      const kv=lf.previousElementSibling&&lf.previousElementSibling.querySelector('.kv');
      if(kv)kv.textContent=`${lf.value} %`;};
    lf.onchange=()=>lppSend({fan:S.lppFan},`fan ${S.lppFan}%`);
  }
  const lp=$('#lpppump');
  if(lp)lp.onclick=async e=>{const b=e.target.closest('[data-v]');
    if(!b||b.disabled)return;
    S.lpp={...S.lpp,pump:b.dataset.v};render();
    await lppSend({pump:b.dataset.v},`pump ${PUMP[b.dataset.v]||b.dataset.v}`);};
  const lr=$('#lppre');
  if(lr)lr.onclick=async()=>{msg('#lppmsg','scanning for the dock…');
    const d=await api('/api/lpp/reconnect',{method:'POST'});
    S.lpp=d||{running:false};
    msg('#lppmsg',d&&d.ok?'connected':'failed: '+((d&&d.error)||'no response'),!(d&&d.ok));
    render();};

  // keyboard editor
  document.querySelectorAll('[data-key]').forEach(el=>el.onclick=e=>{
    const id=el.dataset.key,k=KEYS.find(x=>x.id===id);
    if(e.altKey)S.sel=KEYS.filter(x=>k.gc?x.row===k.row&&x.gc:!x.gc).map(x=>x.id);
    else if(e.shiftKey){const i=S.sel.indexOf(id);i>=0?S.sel.splice(i,1):S.sel.push(id);}
    else S.sel=[id];
    render();
  });
  document.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{
    const r=b.dataset.region;
    S.sel=r==='all'?KEYS.map(k=>k.id):KEYS.filter(k=>k.region===r).map(k=>k.id);
    render();
  });
  const fa=$('#fillall');if(fa)fa.onclick=()=>{KEYS.forEach(k=>S.kbColors[k.id]=S.cur);render();};
  const cs=$('#clearsel');if(cs)cs.onclick=()=>{S.sel=[];render();};
  const kb=$('#kbbri');if(kb)kb.oninput=()=>{S.kbBri=+kb.value;};
  const ks=$('#kbsave');if(ks)ks.onclick=()=>{S.kbSave=!S.kbSave;render();};
  const kc=$('#kbcorrect');if(kc)kc.onclick=()=>{S.kbCorrect=!S.kbCorrect;render();};

  const msg=(sel,t,bad)=>{const el=$(sel);if(el){el.textContent=t;
    el.style.color=bad?'var(--color-danger)':'var(--color-accent)';}};
  const ak=$('#applykb');
  if(ak)ak.onclick=async()=>{msg('#kbmsg','applying…');
    const d=await api('/api/rgb/perkey',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({colors:S.kbColors,brightness:S.kbBri,save:S.kbSave,correct:S.kbCorrect})});
    msg('#kbmsg',d&&d.ok?`applied ${d.keys} keys${d.saved?' · saved to flash':''}`:
      'failed: '+((d&&d.error)||'no response'),!(d&&d.ok));};

  document.querySelectorAll('[data-eff]').forEach(b=>b.onclick=()=>{S.eff=b.dataset.eff;render();});
  document.querySelectorAll('[data-effcol]').forEach(b=>b.onclick=()=>{S.effColor=+b.dataset.effcol;render();});
  const ae=$('#applyeff');
  if(ae)ae.onclick=async()=>{msg('#kbmsg','applying…');
    const d=await api('/api/rgb/effect',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:S.eff,brightness:S.kbBri,color_idx:S.effColor,save:S.kbSave,
        speed:KB_SPEED_INVERTED?toWireSpeed(S.kbSpeed):S.kbSpeed})});
    msg('#kbmsg',d&&d.ok?`applied ${S.eff}`:'failed: '+((d&&d.error)||'no response'),!(d&&d.ok));};

  // Colour pickers. Dragging must NOT re-render: render() rebuilds innerHTML,
  // which would drop the slider mid-drag. Patch the preview in place on input
  // and only re-render on release, when the keyboard map needs to catch up.
  document.querySelectorAll('[data-picker]').forEach(p=>{
    const id=p.dataset.picker;
    const read=()=>CHAN.map(([k])=>+p.querySelector(`[data-ch="${k}"]`).value);
    const store=hex=>{
      if(id==='chin')S.chin.color=hex;
      else{S.cur=hex;S.sel.forEach(kid=>S.kbColors[kid]=hex);}
    };
    const paint=hex=>{
      p.querySelector('[data-pv]').style.background=hex;
      p.querySelector('[data-hexlbl]').textContent=hex;
      const inp=p.querySelector('[data-hexin]');
      if(document.activeElement!==inp)inp.value=hex;
    };
    p.querySelectorAll('.ch').forEach(sl=>{
      sl.oninput=()=>{
        p.querySelector(`[data-val="${sl.dataset.ch}"]`).textContent=sl.value;
        const hex=rgb2hex(...read());store(hex);paint(hex);
      };
      sl.onchange=()=>render();
    });
    const hx=p.querySelector('[data-hexin]');
    hx.oninput=()=>{
      const t=hx.value.trim().replace(/^#/,'');
      if(!/^[0-9a-fA-F]{6}$/.test(t))return;      // ignore half-typed input
      const hex='#'+t.toUpperCase();
      store(hex);paint(hex);
      const v=hex2rgb(hex);
      CHAN.forEach(([k],i)=>{p.querySelector(`[data-ch="${k}"]`).value=v[i];
        p.querySelector(`[data-val="${k}"]`).textContent=v[i];});
    };
    hx.onchange=()=>render();
  });
  const ac2=$('#applychin');
  if(ac2)ac2.onclick=async()=>{msg('#chinmsg','applying…');
    const d=await api('/api/rgb/chinbar',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({mode:S.chin.mode,color:S.chin.color,brightness:S.chin.bri,
        speed:toWireSpeed(S.chin.speed)})});
    msg('#chinmsg',d&&d.ok?`chin bar → ${S.chin.mode}`:'failed: '+((d&&d.error)||'no response'),!(d&&d.ok));};
  bindFans();
  bindGpu();
  bindLocks();
  bindIcc();
  bindDisplay();
  bindBattLight();
  bindSaver();
}
window.addEventListener('keydown',e=>{
  if(S.section!=='light'||S.kbTab!=='perkey')return;
  if(e.key==='Escape'){S.sel=[];render();}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){e.preventDefault();S.sel=KEYS.map(k=>k.id);render();}
});

refreshState();poll();setInterval(poll,1000);setInterval(refreshState,10000);
</script>
</body>
</html>
