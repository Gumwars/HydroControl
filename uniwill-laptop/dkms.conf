# DKMS packaging for the HYDROC-16-patched uniwill-laptop driver.
#
# Mainline ships uniwill-laptop, but its DMI table has no entry for the
# Eluktronics HYDROC-16 G1, so the stock module never binds. This tree adds that
# entry plus a combined battery extension.
#
# Without DKMS the module must be rebuilt by hand after every kernel update, and
# the failure is silent: it presents as "hwmon is down", not "your module was
# rejected on vermagic". Worse, a stale copy in updates/ shadows the working
# stock module, so modprobe never falls through to it.

PACKAGE_NAME="uniwill-laptop"
# No hyphens. Arch's pacman DKMS hook splits /usr/src/<name>-<version> at the
# last hyphen, so "1.0-hydroc16" was registered as module "uniwill-laptop-1.0".
# install.sh reads this value and refuses a hyphenated one.
PACKAGE_VERSION="1.0.hydroc16"

BUILT_MODULE_NAME[0]="uniwill-laptop"
DEST_MODULE_LOCATION[0]="/kernel/drivers/platform/x86"

# The Makefile takes KDIR so DKMS can target a kernel other than the running one.
MAKE[0]="make KDIR=/lib/modules/${kernelver}/build"
CLEAN="make KDIR=/lib/modules/${kernelver}/build clean"

AUTOINSTALL="yes"
